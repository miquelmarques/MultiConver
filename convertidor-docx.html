<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX a Markdown - MultiConvert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script src="https://unpkg.com/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>
    <style>
        .editor-box { min-height: 200px; border: 2px dashed #d1d5db; padding: 1rem; background-color: #f9fafb; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-blue-600">MultiConvert</a>
        <div class="space-x-6">
            <a href="index.html" class="hover:text-blue-600 transition">Inici</a>
            <a href="convertidor-docx.html" class="text-blue-600 font-medium">DOCX 2 MD</a>
            <a href="convertidor-imatges.html" class="hover:text-blue-600 transition">Imatges</a>
            <a href="convertidor-pdf.html" class="hover:text-blue-600 transition">PDF 2 Word</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto py-12 px-4">
        <h1 class="text-3xl font-bold mb-6 text-center">Convertir DOCX a Markdown</h1>
        
        <div class="bg-white shadow-md rounded-lg p-8">
            <div class="flex justify-center mb-8">
                <div class="inline-flex rounded-md shadow-sm" role="group">
                    <button type="button" id="tab-file" onclick="switchTab('file')" class="px-4 py-2 text-sm font-medium text-blue-700 bg-white border border-gray-200 rounded-l-lg">Fitxer</button>
                    <button type="button" id="tab-paste" onclick="switchTab('paste')" class="px-4 py-2 text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-r-lg">Enganxar</button>
                </div>
            </div>

            <div id="ui-file" class="flex flex-col items-center gap-4">
                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold"> Puja el teu fitxer</span> .docx</p>
                    </div>
                    <input type="file" id="fileInput" class="hidden" accept=".docx" onchange="handleFileUpload(event)" />
                </label>
            </div>

            <div id="ui-paste" class="hidden flex flex-col items-center gap-4">
                <div id="paste-area" contenteditable="true" class="editor-box w-full" placeholder="Enganxa el contingut aquí..."></div>
                <button onclick="convertPastedText()" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition font-medium">Convertir Text</button>
            </div>

            <div id="result-container" class="mt-10 hidden">
                <h2 class="text-xl font-semibold mb-4">Resultat:</h2>
                <div class="relative">
                    <textarea id="resultArea" class="w-full h-96 p-4 border border-gray-300 rounded-md font-mono text-sm bg-gray-50" readonly></textarea>
                    <button onclick="copyToClipboard()" class="absolute top-2 right-2 bg-gray-200 text-gray-700 px-3 py-1 rounded text-xs hover:bg-gray-300">Copiar</button>
                </div>
                <div class="mt-4 flex justify-end">
                    <button onclick="location.reload()" class="text-blue-600 hover:underline text-sm">Reiniciar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script-docx.js"></script>
</body>
</html>
