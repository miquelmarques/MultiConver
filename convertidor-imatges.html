<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertir Imatges - MultiConvert</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-bold text-blue-600">MultiConvert</a>
        <div class="space-x-6">
            <a href="index.html" class="hover:text-blue-600 transition">Inici</a>
            <a href="convertidor-docx.html" class="hover:text-blue-600 transition">DOCX 2 MD</a>
            <a href="convertidor-imatges.html" class="text-blue-600 font-medium">Imatges</a>
            <a href="convertidor-pdf.html" class="hover:text-blue-600 transition">PDF 2 Word</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto py-12 px-4">
        <h1 class="text-3xl font-bold mb-6 text-center">Convertir Format d'Imatge</h1>
        
        <div class="bg-white shadow-md rounded-lg p-8">
            <div class="flex flex-col items-center gap-6">
                <div class="w-full">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Selecciona la imatge:</label>
                    <input type="file" id="imageInput" accept="image/*" class="w-full p-2 border border-gray-300 rounded-md" onchange="previewImage(event)" />
                </div>

                <div id="preview-container" class="hidden flex flex-col items-center">
                    <img id="previewImage" class="max-h-64 rounded shadow-sm mb-4" />
                    
                    <div class="flex items-center gap-4">
                        <label class="text-sm font-medium">Convertir a:</label>
                        <select id="formatSelect" class="p-2 border border-gray-300 rounded-md bg-white">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg">JPEG</option>
                            <option value="image/webp">WebP</option>
                        </select>
                        <button onclick="convertImage()" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition font-medium">Descarregar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script-images.js"></script>
</body>
</html>
